<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMP Concrete and Dispatch LLC — Panel WhatsApp</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="brand">🏗️</div>
    <h1>JMP Concrete and Dispatch</h1>
    <p class="sub">Panel del bot de WhatsApp</p>
    <input id="login-user" type="text" placeholder="Usuario" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="login-btn" class="btn-primary">Entrar</button>
    <p id="login-error" class="error hidden"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="topbar-title">🏗️ JMP Concrete and Dispatch <span class="tag">WhatsApp</span></div>
    <nav class="tabs">
      <button class="tab active" data-tab="inbox">📥 Bandeja</button>
      <button class="tab" data-tab="campaigns">📣 Campañas</button>
      <button id="logout-btn" class="tab logout">Salir</button>
    </nav>
  </header>

  <!-- ===== Bandeja ===== -->
  <section id="tab-inbox" class="tabpane">
    <aside class="conversations">
      <div class="conv-header">Conversaciones <span id="conv-count"></span></div>
      <div id="conv-list"></div>
    </aside>
    <main class="chat">
      <div id="chat-empty" class="chat-empty">Seleccione una conversación 👈</div>
      <div id="chat-active" class="hidden">
        <div class="chat-header">
          <div>
            <div id="chat-name" class="chat-name"></div>
            <div id="chat-meta" class="chat-meta"></div>
          </div>
          <div class="chat-actions">
            <button id="btn-survey" class="btn-small" title="Enviar encuesta de satisfacción post-entrega">📋 Encuesta</button>
            <button id="btn-pause" class="btn-small" title="Pausar o reanudar el bot en este chat">⏸️ Pausar bot</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="reply-box">
          <textarea id="reply-text" rows="2" placeholder="Escriba como especialista… (Enter para enviar)"></textarea>
          <button id="reply-btn" class="btn-primary">Enviar</button>
        </div>
      </div>
    </main>
  </section>

  <!-- ===== Campañas ===== -->
  <section id="tab-campaigns" class="tabpane hidden">
    <div class="camp-wrap">
      <div class="camp-form">
        <h2>Nueva campaña</h2>
        <p class="hint">Se envía por <strong>plantilla aprobada de Meta</strong>. La plantilla debe existir y estar aprobada en su cuenta de WhatsApp Business.</p>
        <label>Nombre interno<input id="camp-name" type="text" placeholder="Ej. Oferta yardas - Octubre"></label>
        <label>Nombre de la plantilla<input id="camp-template" type="text" placeholder="Ej. oferta_concreto"></label>
        <label>Idioma<input id="camp-lang" type="text" value="es"></label>
        <label>Destinatarios (un teléfono por línea, con código de país: 17863662018)
          <textarea id="camp-recipients" rows="6" placeholder="17863662018 Juan&#10;12145550199 Pedro"></textarea>
        </label>
        <button id="camp-send" class="btn-primary">🚀 Enviar campaña</button>
        <p id="camp-error" class="error hidden"></p>
      </div>
      <div class="camp-list">
        <h2>Historial</h2>
        <div id="campaigns"></div>
      </div>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
